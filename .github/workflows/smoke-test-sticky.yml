name: Smoke Test Sticky Status

# Keep a green `pull-kube-agents-smoke-test` result valid when `main` moves.
#
# Tide credits a presubmit only against the base SHA it ran on, which crier
# records as a `BaseSHA:<sha>` suffix on the commit status. Every merge to
# `main` therefore turns every other pull request's green smoke run stale, and
# the job runs again for a pull request whose head has not changed (#1179,
# #1202) -- a retest step 0 (`hack/ci-revalidate.sh`) answers in minutes from
# the head's own green, where it once cost the 1.5-3.5h matrix; the re-pin is
# what spares even that. `scripts/pin_smoke_status.py` re-pins that suffix to the new
# head of `main` -- for every open pull request on each push to `main`, and
# every five minutes for the pull requests in Tide's pool, where a green that
# arrived after `main` had already moved (or with no base at all, as the
# override plugin's own status does) would otherwise cost a retest -- so a pull
# request green at its own head merges without a fresh-base retest. What that
# gives up is testing the combination with the `main` it lands on before the
# merge; the nightly eval on `main` is what finds a bad combination, as is
# the next smoke run that actually starts after it, on whichever pull
# request that is. docs/pull-request-workflow.md "How a
# change merges" owns that statement; the script's docstring says why this is
# a BaseSHA pin and not Prow's `[prow:skip-retest]` sentinel, and when to swap.
#
# What it does NOT change: a push creates a new head with no status, so the
# job runs as before; `/test pull-kube-agents-smoke-test` on the same head
# posts `pending`, which is newer and wins (`/retest` does not -- it reruns
# only failed contexts); a red is never touched.
#
# An admin `/override` is re-pinned like a green -- crier stamps the same
# `BaseSHA:` suffix on it -- so a plain `/override` holds for the head it was
# given until a push whenever the sweep wins the race below; when it loses,
# step 0 reads the override off the head and reuses it as it does a green,
# so the override holds either way until a push (this Prow has no
# `/override-cancel`; step 0 would honour one).
# Upstream's `/override-sticky` has no race, and this Prow does not have it.
#
# It races Tide's sync loop: a sync that sees the stale statuses before the
# sweep has re-pinned them starts the retest, and crier's `pending` then wins.
# So the job carries nothing it does not need -- the runner's own python3 runs
# a stdlib-only script -- and has no concurrency group: GitHub keeps one
# pending run per group and cancels the older one, which would drop a pin,
# while two runs pinning the same commit to the same head are harmless.
#
# The late-green case used to be a `status` trigger, one run per status event
# on the repository -- Tide's own `tide` context on each sync, every CI
# context on every push -- about a thousand a day, of which the `if:` kept
# all but sixty off a runner, and each one a run GitHub had to queue (#2943).
# A schedule covers the same case at most five minutes later: a green that
# lands between two sweeps costs at most the retest step 0 answers in a
# minute, and only for a pull request in the pool, which is the only kind a
# stale base costs anything. The scheduled sweep reads the pool alone, because
# one status read per open pull request every five minutes is most of
# GITHUB_TOKEN's hourly budget for the repository; the push sweep still
# reads every open pull request. A push to `main` is only ever Tide's merge.

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  pin:
    name: Pin green smoke-test statuses to the head of main
    # The repository guard is required of any credentialed workflow that starts
    # on its own (AGENTS.md, Pull Request Hygiene). Every event this starts on
    # does the same work, a sweep, so nothing else gates the job.
    if: github.repository == 'gke-labs/kube-agents'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the default branch: the script
      statuses: write # re-post the smoke-test status on pull request heads
    steps:
      # The default branch, never a pull request head: this job holds a
      # writable token and must not run code from a fork.
      - name: Checkout the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nothing from the event is needed, not even GITHUB_SHA: two merges
      # seconds apart start two sweeps with no ordering between them, so the
      # script reads the head of main just before each write rather than
      # pinning to the head this run started with.
      - name: Re-pin every open pull request after the merge
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pin_smoke_status.py sweep

      # Event fields go in through the environment, never into the script
      # text: the description is free text written by another app. The script
      # resolves the head of main itself and re-posts only if this status is
      # still the latest on its context.
      - name: Re-pin the pool's greens that arrived after main moved
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pin_smoke_status.py sweep --pool-only
