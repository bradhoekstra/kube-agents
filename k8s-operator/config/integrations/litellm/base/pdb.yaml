apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm
spec:
  # The gateway runs two replicas, so one can always stay up through a node
  # drain. Every LLM call in the install goes through it: without this a drain
  # of two nodes in quick succession can take both pods at once and the agent's
  # model endpoint disappears mid-turn.
  #
  # minAvailable stays strictly below spec.replicas — at 2 it would allow zero
  # disruptions and block drains outright, which is `blocking-pdb` in
  # agents/platform/governance/obtainability_audit_sop.md §3.4.
  minAvailable: 1
  # Copied from the Deployment's own immutable spec.selector; §3.3 of that same
  # audit matches PDB to workload by selector, never by name.
  selector:
    matchLabels:
      app: litellm
