static_resources:
  listeners:
    - name: credential_proxy
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 8765
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: credential_proxy
                # How long a stream may go without a byte in either direction
                # before Envoy resets it. The default is five minutes, which is
                # also the broker's own command deadline
                # (CREDENTIAL_PROXY_TIMEOUT_SECONDS, 300 s), and the broker writes
                # nothing to the stream until a request is answered. One request
                # can run more than one command back to back: a vcs publish
                # fetches and then pushes, each a network command with the full
                # deadline, and a kubectl naming a cluster whose kubeconfig is
                # not cached fetches credentials first (on the shorter kubectl
                # deadline). The silent worst case is therefore two deadlines
                # plus up to a minute queued for a slot, two seconds of SIGTERM
                # grace and five of drain -- about eleven minutes -- after which
                # the broker's answer, partial output and the "timed out" notice
                # included, would arrive on a stream Envoy had already reset.
                # Twenty minutes covers that with room; an operator raising the
                # broker's deadline raises this with it, keeping it above twice
                # the deadline plus the minute.
                stream_idle_timeout: 1200s
                route_config:
                  name: credential_proxy
                  virtual_hosts:
                    - name: credential_proxy
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route:
                            cluster: credential_runtime
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: credential_runtime
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: credential_runtime
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe:
                      path: /var/run/credential-proxy/backend.sock

admin:
  address:
    pipe:
      path: /var/run/credential-proxy/envoy-admin.sock
