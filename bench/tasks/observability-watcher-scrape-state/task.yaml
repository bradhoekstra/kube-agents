# A question about the agent's own observability: whether the event watcher's
# Prometheus metrics are scraped on this install, how the scrape is configured
# and what proves it is working. The answer comes from the kube-agents
# observability skill. The skill used to send the agent to the gateway
# Deployment for scrape annotations the operator has never rendered, and an
# operator reported the agent answering "not scraped" on an install the managed
# collector scraped every 30s through the chart's `<name>-gateway-monitoring`
# PodMonitoring. On the live-test install the delegated worker found the
# PodMonitoring without the skill's help, so this case did not go red against
# the old skill; it guards the answer instead: the mechanism, the listener (the
# `agent-api-auth` container's `event-metrics` port, 9095), one of the proving
# series (`up{job="<name>-gateway-monitoring"}` or `k8s_event_watcher_cluster_up`),
# and the worker's own read of the PodMonitoring.
#
# Graded on the route and the answer. The worker has to have read the
# PodMonitoring off the install (a `kubectl get podmonitoring` in its terminal
# log), because the required phrases are the skill's own vocabulary and an
# answer composed from the skill without a read would otherwise pass on them;
# and the final answer has to name the mechanism, the port and one of the two
# proving series, which an answer built on the Deployment's annotations does
# not. The install under test has to carry the gateway PodMonitoring
# for the question to have the answer the skill gives; the chart renders it
# where the cluster serves the PodMonitoring API, and a kustomize install
# needs it applied by hand before the run.
# No `fixtures:`: the case reads the agent's own install, not the seeded
# fleet. No `domains.yaml` row covers the agent's own observability, which is
# why the case is a reviewed KNOWN_NO_DOMAIN entry in
# scripts/validate_bench_cases.py rather than a slug.
#
# Expected cost bracket: ~100-300s, one delegation round trip and a handful of
# reads of the agent's own namespace.
id: observability-watcher-scrape-state
name: The event watcher's metrics are scraped through the PodMonitoring
prompt: >-
  Are the event watcher's Prometheus metrics being scraped on this install?
  Tell me how the scrape is configured, where the watcher's listener is, and
  which series in Cloud Monitoring prove that the collector is scraping it.
expected_output: >-
  The scrape is configured by the PodMonitoring named after the agent with the
  gateway-monitoring suffix, which targets the event watcher's listener on the
  gateway pod's agent-api-auth container, port 9095 (event-metrics); the proof
  that the collector is scraping it is in Cloud Monitoring, as up for that job
  and k8s_event_watcher_cluster_up for each watched cluster, with the watcher's
  own cluster and location labels arriving as exported_cluster and
  exported_location. The answer does not rest on scrape annotations on the
  gateway Deployment, which the operator does not render.
infrastructure:
  deployer: noop
validated: false
owner: bradhoekstra
verification_spec:
  # The front door holds no infrastructure tools, so the question is answered
  # by a delegated worker; worker_commands reads that worker's terminal log and
  # returns an error, not a pass, when nothing was delegated, which this
  # objective makes a stated failure rather than a surprise.
  - name: the-question-was-delegated
    role: objective
    mode: assert
    check:
      type: tool_called
      tool_names: ["kanban_create"]
      # An errored kanban_create delegated nothing.
      require_success: true
  # The route: the worker read a PodMonitoring off the install, with `get` or
  # `describe`, in any letter case -- not the CRD that defines the kind, and not
  # a `kubectl auth can-i get podmonitoring` permission probe, which names the
  # resource without reading it. kubectl has to be the command invoked, not text
  # quoted inside another -- a `grep`/`echo` of the command string reads nothing
  # -- so the pattern anchors it to the start of a shell segment (the line start
  # or after `;`, `&`, `|`, `(`, `$(`) and refuses a segment that opens a quote
  # (a single quote, double quote or backtick) before kubectl. Before kubectl it
  # then admits any run of non-separator, non-quote characters and an optional
  # path, so a wrapper -- `env`, `time`, `sudo -E`, `timeout -k 5 30`,
  # `xargs ... kubectl`, a loop's `do kubectl`, an `if kubectl`, `/usr/bin/kubectl`
  # -- does not hide it, and `cd x && kubectl ...` / `kubectl ... | yq` still
  # read. The noun must be a bare argument: preceded by a space, tab or comma and
  # followed by one or the segment end, so a `kind=PodMonitoring` selector or a
  # `-o yaml > gateway-podmonitoring.yaml` redirect, where the noun is glued to
  # `=`, `/` or `-`, is not a read. Two false-greens have no single-line regex
  # fix and stand: a bare `echo kubectl get podmonitoring`, and a shell
  # metacharacter inside a quoted string that opens a false segment
  # (`-m "note; kubectl get podmonitoring"`); both are contrived against the
  # recorded runs. The pattern's whole corpus is pinned in
  # bench/tests/test_observability_watcher_scrape_patterns.py.
  # worker_commands reads the card log's one-line rendering and sees terminal
  # commands only, so a read through an MCP tool is invisible to it. The skill's
  # step spells the kubectl command and every recorded run used it.
  - name: the-worker-read-the-podmonitoring
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_patterns:
        - '(?i)(?:^|[\n;&|(]|\$\()[ \t]*(?:[^\n;&|()''"`]*[ \t])?(?:[^\s;&|()''"`]*/)?kubectl\b(?![^\n|;&]*\bcan-i\b)[^\n|;&]*\b(get|describe)\b(?![^\n|;&]*\b(crds?|customresourcedefinitions?)\b)[^\n|;&]*[ \t,]podmonitorings?(\.monitoring\.googleapis\.com)?(?=[ \t,/]|$)'
  # The final answer names the mechanism, the port and one of the two proving
  # series. `mode: assert` because the final message is immutable once the run
  # ends; polling a failed phrase would only wait out the timeout. The required
  # phrases are the skill's own vocabulary, so the any_of series raises the bar:
  # a worker cites up{job=...} or k8s_event_watcher_cluster_up only after it has
  # queried Cloud Monitoring for them. This objective carries no polarity on its
  # own: a thorough negative that queried the series and found it empty
  # ("up{job=...} returned nothing, 9095 is not scraped") names all three and
  # passes it, so a green here means the worker read the PodMonitoring and queried
  # the series. The conclusion -- that the watcher IS scraped -- is graded by the
  # next objective. The skill regression this case is built around -- step 1
  # reading scrape annotations off the Deployment -- is guarded model-free by
  # tests/test_observability_skill_scrape_step.py.
  - name: the-answer-names-the-podmonitoring-the-listener-and-the-proof
    role: objective
    mode: assert
    check:
      type: report_contains
      required_phrases:
        - "PodMonitoring"
        - "gateway-monitoring"
        - "9095"
      any_of_phrases:
        - "up{job="
        - "k8s_event_watcher_cluster_up"
  # The conclusion's polarity, which the objective above does not carry: the
  # answer must affirm the watcher is scraped, not merely name the mechanism and
  # series while concluding it is not. any_of of affirmative scrape phrasings,
  # each a contiguous substring whose word before "scrap" is a non-negator, so an
  # inserted "not"/"n't" breaks the match: a "scraped"/"is being scraped" answer
  # hits one, a "not scraped"/"not being scraped" answer hits none. A
  # forbidden_phrases on the negation is not used -- a correct answer may note the
  # credential-proxy PodMonitoring is unscraped while the watcher is, and a bare
  # "not scraped" ban would false-red it. Both polarities are pinned in
  # bench/tests/test_observability_watcher_scrape_patterns.py.
  - name: the-answer-affirms-the-watcher-is-scraped
    role: objective
    mode: assert
    check:
      type: report_contains
      any_of_phrases:
        - "is scraped"
        - "are scraped"
        - "is being scraped"
        - "are being scraped"
        - "is scraping"
        - "are scraping"
        - "scrapes the"
        - "scrapes it"
        - "scrapes them"
