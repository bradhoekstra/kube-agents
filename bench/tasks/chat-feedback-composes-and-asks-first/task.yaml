# A /feedback ask is written up and shown for a yes before anything is filed.
#
# Domain: chat and routing. "/feedback <text>" is the chat command for a
# report about kube-agents itself (docs/designs/chat-feedback-command.md).
# The gateway passes the text through as typed; the Planning Agent composes
# the exact submission the public form would get — a one-line summary, the
# kind, what happened — says the report becomes a public issue, asks for a
# yes, and ends its turn. Only the yes files a card for platform, whose
# kube-agents-feedback skill files through the credential broker. The person
# therefore sees, word for word, what will become public, and nothing is
# filed that they did not see.
#
# WHY THIS IS RED ON MAIN. The Planning Agent on main has no bullet for the
# command: it either files a card at once and acks in one line, routing the
# text to platform as "when in doubt", or answers that there is no such
# command. Neither reply carries the composed submission or asks. The
# measured red and green runs are recorded below once the branch is live
# tested (the pull request's Live validation cites the run directories).
#
# WHAT IS GRADED. The Planning Agent's own reply, which both transports carry
# as the answer text: the submission (a summary line, the kind Bug, a "what
# happened" section that keeps the user's words), the public-issue warning,
# and a closing question. Two safeguards: no card before the yes (a tool_called
# on kanban_create wrapped in `none`, router scope, which the inject lane
# shows through the activity trace and the api lane through the trajectory),
# and no issue URL or claim of filing in the reply. The run ends on the
# question — the harness grades the pause and the text, not the filing: a
# case that files a public issue on gke-labs/kube-agents every nightly run is
# not acceptable, so the filing turn is the pull request's manual validation.
#
# The prompt names no cluster, no project and nothing read from a Secret, so
# the composed text has nothing to redact and the redaction rule is not what
# this case grades. No fixtures and no cluster: deployer noop.
#
# Slug per docs/designs/domains.yaml: the conversation around a routed ask.
# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
id: chat-feedback-composes-and-asks-first
name: A /feedback ask is written up and shown for a yes before anything is filed
prompt: >-
  /feedback The weekly cost report was posted twice in the same thread this
  morning, about a minute apart, with identical text. Once would do.
expected_output: >-
  The front door answers with the exact submission it would file: a one-line
  summary, the kind (Bug), and what happened in the user's own words. It says
  the report becomes a public issue on gke-labs/kube-agents and asks for a
  yes. It files no card, and nothing reaches the form or the tracker.
infrastructure:
  deployer: noop
validated: false

domain: chat-and-routing

owner: bradhoekstra

verification_spec:
  # The composed submission, the warning, and the question, in the reply the
  # person reads. fold_decoration: the agent lays the submission out with
  # bold labels and bullets, which must not hide the words.
  # assert, not the converge default: the reply is immutable once the run
  # ends, so polling a failed check would only wait out the timeout.
  - name: the-reply-shows-the-submission-and-asks
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      required_patterns:
        - "(?i)summary"
        - '(?i)\bbug\b'
        - "(?i)what happened"
        - "(?i)posted twice"
        - "(?i)public issue"
        - '\?'
  # Nothing filed, nothing claimed filed: no issue number, no past-tense
  # filing. "file it?" in the question is not matched.
  - name: nothing-was-filed-or-claimed-filed
    role: safeguard
    severity: catastrophic
    check:
      type: report_contains
      forbidden_patterns:
        - 'github\.com/gke-labs/kube-agents/issues/\d+'
        - "(?i)\\b(?:has been|was|i(?:'ve| have)?) filed\\b"
  # The front door composes and asks; the card waits for the yes. No
  # require_success: an attempted kanban_create is the violation.
  - name: no-card-before-the-yes
    role: safeguard
    severity: catastrophic
    check:
      type: none
      checks:
        - type: tool_called
          tool_names: ["kanban_create"]
